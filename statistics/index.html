<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estadísticas</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#dfe3e8;--primary:#2563eb;--danger:#dc2626}
[data-theme="dark"]{--bg:#0f141b;--card:#171e27;--text:#eef2f6;--muted:#aab4c0;--line:#2b3440;--primary:#6ea8fe;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
main{max-width:1200px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px;font-size:30px}.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.login{max-width:420px;margin:12vh auto}.filters,.actions{display:flex;gap:10px;flex-wrap:wrap}.filters label{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}
input,select,button{font:inherit}input,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:var(--primary);border-color:var(--primary);color:#fff}.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px}.stat strong{display:block;font-size:28px;margin-top:5px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:var(--muted)}
tr.highlight{font-weight:700;background:color-mix(in srgb,var(--danger) 10%,var(--card))}
.notice{margin-top:12px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--primary) 10%,var(--card))}
.admin{border-left:4px solid var(--danger)}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.small{font-size:13px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.topbar{flex-direction:column}}
</style>
</head>
<body>
<main>
<section id="login" class="card login">
<h1>Panel de estadísticas</h1><p class="muted">Acceso privado</p>
<label>Clave del panel<input id="key" type="password" autocomplete="current-password"></label>
<div class="actions" style="margin-top:12px"><button class="primary" onclick="login()">Entrar</button></div>
<p id="loginError" class="muted"></p>
</section>

<section id="app" hidden>
<div class="topbar">
<div><h1>Estadísticas</h1><div class="muted">Panel privado</div></div>
<div class="actions"><button onclick="refreshDashboard()">Actualizar</button><button onclick="toggleTheme()">Modo oscuro</button><button onclick="logout()">Salir</button></div>
</div>

<section class="card">
<div class="filters">
<label>Cliente<select id="client"><option value="">Todos</option></select></label>
<label>Quiz<select id="quiz"><option value="">Todos</option></select></label>
<label>Año<select id="year"><option value="">Todos</option></select></label>
<label>Mes<select id="month"><option value="">Todos</option></select></label>
</div>
<div class="actions" style="margin-top:12px">
<button class="primary" onclick="applyFilters()">Aplicar filtros</button>
<button onclick="clearFilters()">Limpiar filtros</button>
<button onclick="csv('quizzes')">Exportar quizzes CSV</button>
<button onclick="csv('questions')">Exportar preguntas CSV</button>
</div>
</section>

<section class="card"><div class="stats" id="stats"></div></section>
<section class="card"><h2>Quizzes</h2><div id="quizzes" class="table-wrap"></div></section>
<section class="card"><h2>Preguntas</h2><div id="questions" class="table-wrap"></div></section>

<section class="card admin">
<h2>Administración de pruebas</h2>
<p class="muted">Usa estas acciones solo para eliminar intentos de prueba antes de entregar un quiz.</p>
<div class="admin-grid">
<button class="danger" onclick="deleteTests('quiz')">Eliminar pruebas de este quiz</button>
<button class="danger" onclick="deleteTests('client')">Eliminar pruebas de este cliente</button>
<button class="danger" onclick="deleteTests('all')">Eliminar todas las pruebas</button>
</div>
<p id="adminMsg" class="small muted"></p>
</section>
</section>
</main>

<script>
let panelKey=localStorage.getItem('statsDashboardKey')||'';
let currentData=null;
let optionCatalog={clients:[],quizzes:[],years:[],months:[]};

const $=id=>document.getElementById(id);

function theme(){return localStorage.getItem('statsTheme')||'light'}
function applyTheme(){document.documentElement.dataset.theme=theme()==='dark'?'dark':''}
function toggleTheme(){const next=theme()==='dark'?'light':'dark';localStorage.setItem('statsTheme',next);applyTheme()}
applyTheme();

function esc(v){
  return String(v??'').replace(/[&<>"']/g,s=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}

function rememberCatalog(){
  try{
    localStorage.setItem('statsQuizCatalog',JSON.stringify(optionCatalog.quizzes||[]));
    localStorage.setItem('statsClientCatalog',JSON.stringify(optionCatalog.clients||[]));
  }catch{}
}

function restoreCatalog(){
  try{
    const qs=JSON.parse(localStorage.getItem('statsQuizCatalog')||'[]');
    const cs=JSON.parse(localStorage.getItem('statsClientCatalog')||'[]');
    if(Array.isArray(qs)) optionCatalog.quizzes=[...qs,...optionCatalog.quizzes].filter((x,i,a)=>a.findIndex(y=>y.value===x.value&&y.client_slug===x.client_slug)>=i);
    if(Array.isArray(cs)) optionCatalog.clients=[...cs,...optionCatalog.clients].filter((x,i,a)=>a.findIndex(y=>y.value===x.value)>=i);
  }catch{}
}

function login(){
  const k=$('key').value.trim();
  if(!k)return;
  $('loginError').textContent='';
  load(k,true);
}

async function load(k=panelKey,fromLogin=false){
  try{
    const qs=new URLSearchParams();
    const c=$('client')?.value||'';
    const q=$('quiz')?.value||'';
    const y=$('year')?.value||'';
    const m=$('month')?.value||'';

    if(c)qs.set('client',c);
    if(q)qs.set('quiz',q);
    if(y)qs.set('year',y);
    if(m)qs.set('month',m);

    const r=await fetch('/api/stats-dashboard'+(qs.toString()?'?'+qs:''),{
      headers:{'x-stats-dashboard-key':k}
    });
    const d=await r.json();

    if(r.status===401){
      $('loginError').textContent='Clave incorrecta.';
      if(fromLogin)localStorage.removeItem('statsDashboardKey');
      return;
    }
    if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo cargar el panel');

    panelKey=k;
    localStorage.setItem('statsDashboardKey',k);
    $('login').hidden=true;
    $('app').hidden=false;

    currentData=d.data;
    if(d.data.options){
      optionCatalog=d.data.options;
      restoreCatalog();
      rememberCatalog();
    }

    renderOptions(c,q,y,m);
    renderData(d.data);
  }catch(e){
    $('loginError').textContent=e.message;
  }
}

function renderOptions(selectedClient='',selectedQuiz='',selectedYear='',selectedMonth=''){
  const c=$('client'),q=$('quiz'),y=$('year'),m=$('month');

  c.innerHTML='<option value="">Todos</option>'+
    optionCatalog.clients.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');
  c.value=[...c.options].some(o=>o.value===selectedClient)?selectedClient:'';

  renderQuizOptions(c.value,selectedQuiz);

  y.innerHTML='<option value="">Todos</option>'+
    optionCatalog.years.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  m.innerHTML='<option value="">Todos</option>'+
    optionCatalog.months.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');

  if([...y.options].some(o=>o.value===String(selectedYear)))y.value=selectedYear;
  if([...m.options].some(o=>o.value===String(selectedMonth)))m.value=selectedMonth;
}

function renderQuizOptions(clientValue,selectedQuiz=''){
  const q=$('quiz');
  const quizzes=(optionCatalog.quizzes||[]).filter(x=>
    !clientValue || x.client_slug===clientValue || x.clientSlug===clientValue
  );

  q.innerHTML='<option value="">Todos</option>'+
    quizzes.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');

  q.value=[...q.options].some(o=>o.value===selectedQuiz)?selectedQuiz:'';
}

$('client').addEventListener('change',()=>{
  renderQuizOptions($('client').value,'');
});

function applyFilters(){load(panelKey)}

function refreshDashboard(){load(panelKey)}

function clearFilters(){
  $('client').value='';
  renderQuizOptions('','');
  $('year').value='';
  $('month').value='';
  load(panelKey);
}

function logout(){
  localStorage.removeItem('statsDashboardKey');
  location.reload();
}

function renderData(d){
  const o=d.overall||{};
  $('stats').innerHTML=[
    ['Intentos',o.attempts||0],
    ['Promedio',(o.avg_percent??0)+'%'],
    ['Aciertos',o.total_correct||0],
    ['Respuestas',o.total_answers||0]
  ].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');

  const qz=d.quizzes||[];
  $('quizzes').innerHTML=qz.length
    ? `<table><thead><tr><th>Quiz</th><th>Intentos</th><th>Aciertos</th><th>Errores</th><th>Promedio</th></tr></thead><tbody>${
        qz.map(x=>`<tr><td>${esc(x.quiz_title||x.quiz_slug)}</td><td>${x.attempts||0}</td><td>${x.total_correct||0}</td><td>${x.total_wrong||0}</td><td>${x.avg_percent??0}%</td></tr>`).join('')
      }</tbody></table>`
    : '<p class="muted">No hay resultados para los filtros seleccionados.</p>';

  const q=d.questions||[];
  const ranked=q.map(x=>({...x,errors:(Number(x.attempts)||0)-(Number(x.correct)||0)}))
    .sort((a,b)=>b.errors-a.errors||String(a.question_id).localeCompare(String(b.question_id)));
  const max=ranked.length?ranked[0].errors:0;

  $('questions').innerHTML=ranked.length
    ? `<table><thead><tr><th>#</th><th>Pregunta</th><th>Intentos</th><th>Correctas</th><th>Errores</th><th>% correctas</th></tr></thead><tbody>${
        ranked.map((x,i)=>`<tr class="${x.errors===max&&max>0?'highlight':''}">
          <td>${i+1}</td>
          <td>${esc(x.question_text)}${x.errors===max&&max>0?' <span style="color:var(--danger)">● Más errores</span>':''}</td>
          <td>${x.attempts||0}</td><td>${x.correct||0}</td><td>${x.errors}</td><td>${x.percent_correct??0}%</td>
        </tr>`).join('')
      }</tbody></table>
      <div class="notice"><strong>Pregunta con más errores:</strong> ${
        max>0?esc(ranked[0].question_text)+' — '+max+' error(es).':'No hay errores registrados.'
      }</div>`
    : '<p class="muted">No hay resultados para los filtros seleccionados.</p>';
}

function csv(type){
  const rows=type==='questions'?(currentData?.questions||[]):(currentData?.quizzes||[]);
  if(!rows.length)return alert('No hay datos para exportar.');

  const headers=Object.keys(rows[0]);
  const out=[headers,...rows.map(r=>headers.map(h=>r[h]??''))]
    .map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));
  a.download=`estadisticas-${type}.csv`;
  a.click();
}

async function deleteTests(scope){
  const client=$('client').value;
  const quiz=$('quiz').value;

  if(scope==='quiz'&&!quiz)return alert('Selecciona un quiz.');
  if(scope==='client'&&!client)return alert('Selecciona un cliente.');

  const label=scope==='all'
    ?'todas las pruebas'
    :scope==='client'
      ?'las pruebas del cliente seleccionado'
      :'las pruebas del quiz seleccionado';

  if(!confirm(`¿Seguro que quieres eliminar ${label}?`))return;
  if(!confirm('Esta acción elimina permanentemente los registros de prueba. ¿Continuar?'))return;

  try{
    const r=await fetch('/api/stats-delete',{
      method:'POST',
      headers:{
        'x-stats-dashboard-key':panelKey,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        scope,
        value:scope==='quiz'?quiz:scope==='client'?client:null,
        clientSlug:scope==='quiz'?client:null
      })
    });

    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo eliminar');

    $('adminMsg').textContent=
      `Eliminados: ${d.data?.deletedAttempts||0} intentos y sus respuestas.`;

    // Preserve the quiz/client in the local catalog even when their last test was deleted.
    if(scope==='quiz'&&quiz){
      const existing=optionCatalog.quizzes.find(x=>x.value===quiz);
      if(!existing){
        optionCatalog.quizzes.push({
          value:quiz,
          label:quiz,
          client_slug:client||''
        });
        rememberCatalog();
      }
    }

    await load(panelKey);

    // Re-apply the deleted quiz as the selected filter so it does not disappear
    // immediately after the cleanup action.
    if(scope==='quiz'){
      $('client').value=client;
      renderQuizOptions(client,quiz);
      $('quiz').value=quiz;
    }
  }catch(e){
    $('adminMsg').textContent=e.message;
  }
}

if(panelKey)load(panelKey);
</script>
</body>
</html>
